# OMF MES API 앞단 — 3100 을 받아 «켜진 쪽» api(api-blue | api-green)로 넘긴다.
#
# 켜진 쪽은 여기 적지 않는다. deploy.sh 가 쓰는 /etc/nginx/omf-active/upstream.conf 한 줄
# (`server api-blue:3100 resolve;`)이 유일한 출처다. 이 파일은 저장소에서 동기화되는 고정 설정이다.

# compose 내부 DNS. `resolve` 와 함께 api 컨테이너가 다시 떠 IP 가 바뀌어도 reload 없이 따라간다.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream omf_api {
    zone omf_api 64k;
    include /etc/nginx/omf-active/upstream.conf;
    keepalive 16;
    # Node 의 keepAliveTimeout(5초)보다 짧게 — 길면 Node 가 먼저 닫은 연결을 재사용해 간헐 502 가 난다.
    keepalive_timeout 4s;
}

server {
    listen 3100;

    # 앱의 업로드 상한이 10MB(금형·예비품 파일, 고장 사진)다. nginx 기본 1MB 면 앱에 닿기 전에 413 이다.
    client_max_body_size 12m;

    location = /_proxy/health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://omf_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
