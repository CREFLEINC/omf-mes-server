# OMF MES — 배포 구성 (단일 서버, API + DB)
#
# 이미지는 서버에서 빌드하지 않고 Harbor 에서 받아온다.
# 배포 서버에는 소스코드가 없어도 되고, 개발자 PC 와 운영 서버가 "같은 바이너리"를 쓴다는 게 보장된다.
#
# 실행:  ./deploy.sh                 (권장 — pull · 헬스체크 · 실패 시 자동 롤백)
# 수동:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 중지:  docker compose -f docker-compose.prod.yml --env-file .env.prod down
#
# 배포 대상은 .env.prod 의 IMAGE_TAG 로 갈린다.
#   개발 서버(한국)   IMAGE_TAG=main    — main 머지 후 self-hosted runner 가 자동 배포
#   하노이 운영 서버  IMAGE_TAG=stable  — 자동 배포 없음, 합의된 창에 수동 (deploy/RELEASE.md)
#
# ─── 타임존 정책 ─────────────────────────────────────────────
# 컨테이너는 전부 UTC 로 돌린다. 공장 로컬 시각이 필요한 계산은
# plant.timezone_code 를 명시적으로 사용한다 (하노이 = Asia/Ho_Chi_Minh).
#
# 서버 TZ 를 현장에 맞춰도 business_date 는 맞지 않는다 — shift.crosses_midnight
# 때문에 "실적이 속한 교대의 시작일"은 로컬 날짜 캐스팅으로 얻을 수 없다.
# 어차피 명시적 로직이 필요하므로, 서버 TZ 가 우연히 답을 맞춰주는 상황을
# 만들지 않는 편이 낫다. 잘못 쓴 코드가 개발단에서 바로 틀리게 나온다.
#
# 로그 가독성은 .env.prod 의 LOG_TZ 로 사이트별로 맞춘다.
# ─────────────────────────────────────────────────────────────
#
# 범위 밖(인프라 확정 후 별도 작업): 웜 스탠바이 이중화 · NAS 백업 · 오프라인 설치 패키지
# — 기술스택 결정서 결정 15 참조.

name: omf-mes

# migrate 와 api 가 반드시 같은 이미지를 쓰도록 앵커로 묶는다.
# 따로 적으면 한쪽 태그만 고치는 사고가 난다 — 구버전 코드가 신버전 스키마를 보게 된다.
x-api-image: &api-image ${REGISTRY:-hub.crefle.com}/mes/backend:${IMAGE_TAG:-main}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 필요}
      TZ: UTC
    # initdb 는 감지한 시스템 타임존을 postgresql.conf 에 구워버린다. 한 번 초기화된
    # 클러스터는 나중에 TZ 환경변수를 바꿔도 그 값이 그대로 남는다.
    # -c 로 넘기면 postgresql.conf 를 덮어쓰므로 초기화 순서와 무관하게 항상 이긴다.
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 포트를 호스트로 노출하지 않는다 — API만 내부 네트워크로 접근한다.
    # DB 직접 접속이 필요하면 `docker compose exec postgres psql`을 쓴다.
    #   조회 시 현장 시각으로 보려면: SET TIME ZONE 'Asia/Ho_Chi_Minh';
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # 스키마 반영 전용 1회성 컨테이너. API와 같은 이미지를 쓴다.
  # 여러 인스턴스가 동시에 마이그레이션하는 사고를 막으려면 이 서비스만 스키마를 건드려야 한다.
  migrate:
    image: *api-image
    restart: 'no'
    environment:
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *api-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # 없거나 32자 미만이면 서버가 기동하지 않는다 — 약한 키로 조용히 뜨는 것보다 낫다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요 — openssl rand -base64 48}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      # 브라우저가 다른 오리진에서 부를 수 있게 여는 목록. 쉼표로 구분한다.
      # ⛔ 여기 적어야 컨테이너가 본다 — --env-file 은 이 파일의 ${} 치환용이지
      #    컨테이너 주입이 아니다. 빠뜨리면 .env.prod 에 적어도 CORS 가 꺼진 채 뜨고,
      #    preflight(OPTIONS)가 404 로 떨어진다.
      # 비워 두면 종전대로 꺼짐이다 — 목록 없이 여는 것은 위험하므로 기본을 바꾸지 않는다.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TZ: UTC
    ports:
      - '${API_PORT:-3100}:3100'
    depends_on:
      postgres:
        condition: service_healthy
      # 마이그레이션이 끝난 뒤에 뜬다
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 이미지에 curl이 없다 — Node 22의 내장 fetch를 쓴다.
      # 이 엔드포인트는 DB까지 찌른다(SELECT 1) — Prisma 초기화 실패도 여기서 걸린다.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  pgdata:
