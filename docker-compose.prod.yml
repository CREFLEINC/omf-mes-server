# OMF MES — 최소 배포 구성 (단일 서버, API + DB)
#
# 실행:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 중지:  docker compose -f docker-compose.prod.yml --env-file .env.prod down
#
# 범위 밖(인프라 확정 후 별도 작업): 웜 스탠바이 이중화 · NAS 백업 · 오프라인 설치 패키지
# — 기술스택 결정서 결정 15 참조.

name: omf-mes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 필요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 포트를 호스트로 노출하지 않는다 — API만 내부 네트워크로 접근한다.
    # DB 직접 접속이 필요하면 `docker compose exec postgres psql`을 쓴다.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # 스키마 반영 전용 1회성 컨테이너. API와 같은 이미지를 쓴다.
  # 여러 인스턴스가 동시에 마이그레이션하는 사고를 막으려면 이 서비스만 스키마를 건드려야 한다.
  migrate:
    build:
      context: .
      target: runtime
    image: omf-mes-api:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    image: omf-mes-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      TZ: Asia/Seoul
    ports:
      - '${API_PORT:-3100}:3100'
    depends_on:
      postgres:
        condition: service_healthy
      # 마이그레이션이 끝난 뒤에 뜬다
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 이미지에 curl이 없다 — Node 22의 내장 fetch를 쓴다.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
