name: Deploy to dev server

# 개발 서버(한국) 배포. cron 을 대체한다.
#
# Actions 탭에서 사용자가 지정한 이미지 tag를 수동 배포한다.
#
# 하노이 운영 서버는 이 워크플로 대상이 아니다 — deploy/RELEASE.md 절차를 따른다.
#
# 보안: 이 워크플로는 pull_request 로 트리거되지 않는다. PR 검증(ci.yml)은
# GitHub 호스팅 러너에서 돌기 때문에, 외부 기여자의 코드가 사내 서버에서
# 실행될 경로가 없다. 이 성질을 깨지 않도록 트리거를 늘릴 때 주의할 것.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그 (예: v1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: 개발 서버 배포
    runs-on: [self-hosted, omf-mes-server]
    environment: dev

    env:
      DEPLOY_DIR: /opt/services/omf-mes-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 사전 점검
        run: |
          set -euo pipefail
          test -d "$DEPLOY_DIR"            || { echo "::error::$DEPLOY_DIR 가 없습니다. 최초 1회는 수동으로 구성해야 합니다."; exit 1; }
          test -f "$DEPLOY_DIR/.env.prod"  || { echo "::error::$DEPLOY_DIR/.env.prod 가 없습니다."; exit 1; }
          docker info >/dev/null 2>&1      || { echo "::error::러너 사용자가 docker 그룹에 속해 있지 않습니다."; exit 1; }
          echo "점검 통과"

      - name: 배포 자산 동기화
        run: |
          set -euo pipefail
          # .env.prod 는 절대 건드리지 않는다 — 서버에만 있는 시크릿이다.
          install -m 644 docker-compose.prod.yml         "$DEPLOY_DIR/"
          install -m 644 deploy/omf-mes-deploy.logrotate "$DEPLOY_DIR/"
          install -m 755 deploy/deploy.sh                "$DEPLOY_DIR/"
          install -m 755 deploy/rollback.sh              "$DEPLOY_DIR/"
          # proxy/active/ 는 deploy.sh 가 쓰는 «켜진 쪽» 기록이라 동기화하지 않는다.
          install -D -m 644 deploy/proxy/omf-api.conf    "$DEPLOY_DIR/proxy/conf.d/omf-api.conf"
          echo "동기화 완료"

      - name: 배포
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::image_tag는 v1.2.3 형식이어야 합니다"
            exit 1
          }
          echo "IMAGE_TAG=$IMAGE_TAG"
          cd "$DEPLOY_DIR"
          # ⛔ `./deploy.sh` 를 직접 부르지 않는다. 그것은 셸 IMAGE_TAG 를 «이번 실행에만»
          #    쓰고 .env.prod 에 남기지 않는다(deploy.sh 는 .env.prod 를 읽기만 한다).
          #    그러면 나중에 누가 서버에서 맨손으로 ./deploy.sh 를 한 번만 돌려도
          #    .env.prod 의 옛 태그로 «조용히» 되돌아간다 — 실제로 그렇게 됐다(#628).
          #
          #    rollback.sh 는 이름과 달리 「.env.prod 에 태그를 쓰고 배포」다. CI 배포는
          #    「잠깐 띄워 보기」가 아니라 「이제부터 이게 돈다」이므로 이쪽이 맞다.
          #    일회성으로 띄워 보는 용도는 종전대로 `IMAGE_TAG=vX ./deploy.sh` 다.
          #
          # ⭐ 셸 IMAGE_TAG 를 «지우고» 부른다. 남겨 두면 deploy.sh 가 그것을 일회성
          #    덮어쓰기로 써서, .env.prod 에 제대로 쓰였는지와 무관하게 배포가 성공한다.
          #    지우면 rollback.sh 가 쓴 .env.prod 값이 «유일한 출처»가 되므로,
          #    쓰기가 실패하면 배포가 그 자리에서 틀어진다.
          tag="$IMAGE_TAG"
          unset IMAGE_TAG
          ./rollback.sh "$tag"

      - name: 배포 확인
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # 배포가 「성공했는데 옛 버전」인 상태를 여기서 잡는다. 둘 다 봐야 한다 —
          # DEPLOYED 는 «이번에 뜬 것», .env.prod 는 «다음에 뜰 것» 이다.
          deployed="$(sed -n 's/^image_tag=//p' "$DEPLOY_DIR/DEPLOYED")"
          persisted="$(sed -n 's/^IMAGE_TAG=//p' "$DEPLOY_DIR/.env.prod")"
          echo "요청=$IMAGE_TAG  이번에 뜬 것=$deployed  .env.prod=$persisted"
          [[ "$deployed" == "$IMAGE_TAG" ]] || {
            echo "::error::배포된 태그가 요청과 다릅니다 ($deployed ≠ $IMAGE_TAG)"
            exit 1
          }
          [[ "$persisted" == "$IMAGE_TAG" ]] || {
            echo "::error::.env.prod 에 태그가 남지 않았습니다 ($persisted ≠ $IMAGE_TAG) — 다음 배포가 되돌아갑니다"
            exit 1
          }
          echo "확인 통과"

      - name: 배포 결과 요약
        if: always()
        run: |
          {
            echo "### 개발 서버 배포 결과"
            echo ""
            echo '```'
            cat "$DEPLOY_DIR/DEPLOYED" 2>/dev/null || echo "(DEPLOYED 기록 없음 — 배포가 완료되지 않았습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
