name: CI

# PR 검증 전용 — 이미지는 만들지 않는다.
# main 브랜치 보호 규칙에서 verify 를 required 로 걸어두면
# 깨진 코드가 main 에 못 들어가고, 따라서 Harbor 에도 올라가지 않는다.
on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 필드(pnpm@11.17.0)를 읽어 그 버전을 설치한다 — 로컬과 동일 버전 보장
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # setup-node 의 `cache: pnpm` 은 pnpm store 만 캐시한다 — 링킹은 매번 다시 돈다(약 18초).
      # node_modules 자체를 lockfile 해시로 캐시해 그 시간을 없앤다.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.node-modules.outputs.cache-hit != 'true'

      # [필수] install 만으로는 Prisma Client 가 생성되지 않는다.
      # 캐시가 맞았을 때도 반드시 돈다 — 캐시 키가 lockfile 이라 schema.prisma 변경을
      # 감지하지 못해, 건너뛰면 옛 Client 로 검사하게 된다.
      # 이 단계가 없으면 아래 typecheck 가 모델 타입을 못 찾아 전부 실패한다.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # [필수] 계약 타입도 커밋하지 않는다(.gitignore). 이 단계가 없으면 계약을 참조하는
      # 코드가 typecheck 에서 모듈을 못 찾는다. 계약 json 이 깨져도 여기서 걸린다.
      - name: Generate contract types
        run: pnpm run contracts:generate

      # package.json 의 lint 스크립트는 --fix 가 붙어 있어 CI 에서는 문제를 고쳐버리고 통과한다.
      # 검증 목적이므로 --fix 없이 직접 호출한다.
      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts" --max-warnings=0

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit test
        run: pnpm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      # base 브랜치와 비교해야 하므로 전체 히스토리를 받는다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 문서만 고친 PR 에서 이미지를 다시 빌드해도 검증되는 게 없다.
      # 잡 자체는 항상 돌려 required check 를 만족시키고, 안쪽 단계만 건너뛴다
      # (잡을 통째로 skip 하면 required check 가 채워지지 않아 머지가 막힌다).
      - name: 이미지에 영향을 주는 변경인가
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
             | grep -qE '^(Dockerfile|\.dockerignore|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.swcrc|nest-cli\.json|tsconfig.*\.json|prisma/|contracts/|src/)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '이미지에 영향을 주는 변경이 없어 빌드를 건너뛴다.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.run == 'true'

      # 푸시 없이 이미지가 실제로 빌드되는지만 확인한다.
      # Dockerfile 안에서 pnpm install → prisma generate → nest build 가 모두 돌아가므로
      # 사실상 통합 검증 역할을 한다.
      #
      # cache-to 를 두지 않는다. GHA 캐시는 ref 격리라 PR 이 쓴 캐시는 그 PR 에서만 읽히고
      # 다른 PR 도 main 도 못 읽는다 — 업로드 시간만 쓰고 저장소 한도(10GB)를 채워
      # main 캐시를 LRU 로 축출시킨다. 캐시는 build-push.yml(main push)이 채운다.
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.run == 'true'
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha

  e2e:
    name: E2E (실제 DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omf
          POSTGRES_PASSWORD: omf
          POSTGRES_DB: omf_mes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omf -d omf_mes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://omf:omf@localhost:5432/omf_mes?schema=public
      # setup-e2e.ts 가 32자 미만이면 던진다
      JWT_SECRET: ci-only-secret-value-not-used-in-production-0123456789
      JWT_EXPIRES_IN_SECONDS: 28800
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.node-modules.outputs.cache-hit != 'true'

      - run: pnpm exec prisma generate
      # e2e 는 @swc/jest 라 타입을 벗겨내므로 `import type` 만 쓰는 한 없어도 돈다.
      # 값 import 로 잘못 쓰면 모듈을 못 찾아 죽으므로 보험으로 둔다.
      - run: pnpm run contracts:generate

      - name: Migrate
        run: pnpm exec prisma migrate deploy

      - name: Seed
        run: pnpm run db:seed

      - name: E2E test
        run: pnpm run test:e2e
