name: Build & Push to Harbor

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'          # v1.2.3 형태의 릴리스 태그
  workflow_dispatch:

env:
  REGISTRY: hub.crefle.com
  IMAGE_NAME: mes/backend

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 태그 전략
      #   main 브랜치 push  → :main, :sha-a1b2c3d
      #   v1.2.3 태그 push  → :v1.2.3, :stable, :sha-a1b2c3d
      # git 태그 문자열과 이미지 태그 문자열이 그대로 일치한다(v 접두사 포함).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OMF MES API
            org.opencontainers.image.vendor=Crefle

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # pnpm store 와 prisma 엔진 다운로드가 무거우므로 레이어 캐시를 반드시 쓴다
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false     # Harbor 구버전은 attestation manifest 를 못 읽는 경우가 있다

      - name: Summary
        run: |
          {
            echo "### Harbor 푸시 완료"
            echo ""
            echo "**Digest**: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "**Tags**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
